# Example alerting rules for the modem exporter. Loaded by prometheus.yml.
# Thresholds assume the default MODEM_INTERVAL of 60s, adjust the "for" and
# the 180s constant below if you poll on a different cadence.
groups:
  - name: modem
    rules:
      - alert: ModemUnreachable
        expr: modem_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Exporter can't reach the cable modem"
          description: "modem_up has been 0 for 5 minutes on {{ $labels.instance }}."

      - alert: ModemUncorrectableErrors
        # Summed across channels, so one noisy channel among many healthy ones
        # still fires. Good enough to know something is wrong, the Grafana
        # dashboard's per-channel table is where you find which one.
        expr: sum(rate(modem_downstream_uncorrected_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Modem is accumulating uncorrectable FEC errors"
          description: "{{ $value | printf \"%.3f\" }} uncorrected codewords/s over the last 5m."

      - alert: ModemChannelUnlocked
        expr: count((modem_downstream_locked == 0) or (modem_upstream_locked == 0)) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "A modem channel lost lock"
          description: "One or more DOCSIS channels have been unlocked for 2 minutes."

      - alert: ModemRangingTimeouts
        expr: sum(increase(modem_upstream_ranging_timeouts_total{timer=~"t3|t4"}[15m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Modem is seeing T3 or T4 ranging timeouts"
          description: "More than 3 T3 or T4 ranging timeouts occurred in 15 minutes."

      - alert: ModemEndpointUnavailable
        expr: modem_endpoint_up{endpoint=~"state|eventlog|serviceflows|localization|modemmode"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An optional modem endpoint is unavailable"
          description: "{{ $labels.endpoint }} has failed for 5 minutes while the modem remains reachable."

      - alert: ModemExporterStalled
        expr: (time() - modem_last_poll_timestamp_seconds) > 180
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "modem-exporter poll loop stopped advancing"
          description: "Last poll attempt was over 180s ago. modem_last_poll_timestamp_seconds updates even when the modem is unreachable, so this means the poller thread itself is stuck, not just a slow modem."

      - alert: ModemExporterTargetMissing
        expr: absent(modem_last_poll_timestamp_seconds)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "modem-exporter target isn't reporting at all"
          description: "No modem_last_poll_timestamp_seconds series. The process is down, or Prometheus lost the target, either way the other rules here have nothing to evaluate."
