# Minimal Prometheus config for the modem exporter.
#
# Grafana never talks to the exporter. It queries Prometheus, and Prometheus
# scrapes the exporter. So the data source URL in Grafana is this server on
# port 9090, not the exporter on 9105.
global:
  scrape_interval: 60s

# Example alerting rules, see alerts.yml. Not wired to an Alertmanager here,
# that's a separate piece, this just gets the rules evaluating so they show
# up in Prometheus's own UI.
rule_files:
  - alerts.yml

scrape_configs:
  - job_name: modem
    static_configs:
      - targets: ['localhost:9105']
